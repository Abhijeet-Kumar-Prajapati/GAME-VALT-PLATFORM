name: Deploy to GitHub Pages

# ------------------------------------------------------------
#  Ye workflow site ko build + deploy karta hai.
#
#  Khaas baat: js/config.local.js repo me NAHI hai (gitignore me
#  hai, taaki aapka mobile number / UPI ID public na ho).
#  Ye workflow us file ko GitHub SECRET se bana kar deploy
#  karta hai — isliye live site par payment aur QR kaam karte
#  hain, aur repo me number phir bhi nahi hota.
#
#  Setup (ek baar):
#   1. Repo → Settings → Secrets and variables → Actions
#      → New repository secret
#      Name   : SITE_CONFIG
#      Value  : (neeche diya gaya JS content)
#
#   2. Repo → Settings → Pages → Build and deployment
#      Source : GitHub Actions
# ------------------------------------------------------------

on:
  push:
    branches: [ main ]
  # config ya site change karo to turant deploy ho
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build-and-deploy:
    name: Build aur deploy
    runs-on: ubuntu-latest

    # Ye ZAROORI hai - deploy-pages action ko github-pages
    # environment chahiye. Iske bina error aata hai:
    # "Missing environment. Ensure your workflow's deployment job
    #  has an environment."
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Code checkout karo
        uses: actions/checkout@v4

      - name: Pages configure karo
        uses: actions/configure-pages@v5

      - name: Privacy check (secret me personal data na ho)
        env:
          HAS_SECRET: ${{ secrets.SITE_CONFIG != '' }}
        run: |
          # Secret set hai -> config.local.js secret se aayega, repo clean rahega.
          # Secret set nahi -> repo wali file use hogi, aur agar number
          # accidentally kisi aur file me aa gaya to warning.
          if [ -n "${{ secrets.SITE_CONFIG }}" ]; then
            echo "OK  secret set hai - config.local.js secret se aayega (repo clean)"
          else
            A="9431""393935"
            B="@""fam"
            HITS=$(git ls-files -z | xargs -0 grep -lIE "$A|$B" 2>/dev/null | grep -v 'js/config.local.js' || true)
            if [ -n "$HITS" ]; then
              echo "::error::Personal number repo me hai (config.local.js ke alawa) - deploy band"
              echo "$HITS"
              exit 1
            fi
            echo "OK  repo me sirf js/config.local.js me number hai (jaan-boojhkar)"
          fi

      - name: config.local.js banao (secret se)
        env:
          SITE_CONFIG: ${{ secrets.SITE_CONFIG }}
        run: |
          mkdir -p js
          if [ -n "$SITE_CONFIG" ]; then
            printf '%s' "$SITE_CONFIG" > js/config.local.js
            echo "OK  js/config.local.js secret se ban gaya"
          else
            echo "::warning::SITE_CONFIG secret set nahi hai - site live hogi par payment/QR 'Not configured' dikhega"
          fi

      - name: JS syntax check
        run: |
          for f in js/*.js; do
            [ -e "$f" ] || continue
            node --check "$f" || { echo "::error::$f me syntax error hai"; exit 1; }
          done
          echo "OK  saare JS files valid"

      - name: Artifact upload
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4